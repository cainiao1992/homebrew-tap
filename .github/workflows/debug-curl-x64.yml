name: Debug curl x64

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  probe:
    runs-on: macos-15-intel
    steps:
      - name: Build OpenSSL + configure curl, then dump diagnostics
        run: |
          set -uo pipefail
          W="$RUNNER_TEMP/curl-build"
          P="$W/prefix"
          mkdir -p "$W/src" "$P"
          export PKG_CONFIG_PATH="$P/lib/pkgconfig"
          export CPPFLAGS="-I$P/include"
          export LDFLAGS="-L$P/lib -Wl,-search_paths_first"

          cd "$W"
          curl -fL --retry 3 -o src/openssl.tar.gz https://github.com/openssl/openssl/releases/download/openssl-4.0.2/openssl-4.0.2.tar.gz
          curl -fL --retry 3 -o src/curl.tar.xz https://github.com/curl/curl/releases/download/curl-8_21_0/curl-8.21.0.tar.xz
          mkdir openssl && tar -xzf src/openssl.tar.gz -C openssl --strip-components=1
          mkdir curl && tar -xJf src/curl.tar.xz -C curl --strip-components=1

          cd openssl
          ./Configure no-shared no-tests --prefix="$P" --openssldir="$P/ssl" > /dev/null
          make -j3 install_sw > openssl-install.log 2>&1 || { tail -20 openssl-install.log; exit 1; }
          echo "openssl installed: $(ls "$P/include/openssl/ech.h" && echo ok)"

          cd ../curl
          ./configure --prefix="$W/payload" \
            --with-openssl="$P" \
            --enable-ech --enable-httpsrr \
            --with-nghttp2="$P" --with-ngtcp2="$P" --with-nghttp3="$P" \
            --with-brotli="$P" --with-zstd="$P" \
            --with-zlib --with-ca-bundle=/etc/ssl/cert.pem \
            --without-libpsl --without-libidn2 --without-libssh2 \
            --disable-ldap --disable-ldaps \
            --disable-shared --enable-static \
            LDFLAGS="$LDFLAGS" > configure.log 2>&1 || { tail -30 configure.log; exit 1; }
          grep -E "ECH|ech" configure.log | tail -5

      - name: Diagnostics
        if: always()
        run: |
          set -uo pipefail
          W="$RUNNER_TEMP/curl-build"
          P="$W/prefix"
          echo "== brew openssl in /usr/local:"
          brew list --versions 2>/dev/null | grep -i openssl || echo none
          echo "== /usr/local openssl headers:"
          if [ -f /usr/local/include/openssl/opensslv.h ]; then
            grep -E "OPENSSL_VERSION_(MAJOR|MINOR|PATCH) " /usr/local/include/openssl/opensslv.h | head -3
          else echo "no /usr/local openssl headers"; fi
          echo "== prefix configuration.h OPENSSL_NO_ECH count:"
          grep -c "OPENSSL_NO_ECH" "$P/include/openssl/configuration.h" || echo 0
          echo "== prefix types.h ECH typedef:"
          grep -n "OSSL_ECHSTORE" "$P/include/openssl/types.h" || echo MISSING
          echo "== prefix ssl.h ECH_GREASE:"
          grep -n "define SSL_OP_ECH_GREASE " "$P/include/openssl/ssl.h" || echo MISSING
          echo "== prefix ech.h:"
          ls -la "$P/include/openssl/ech.h" 2>/dev/null || echo MISSING
          echo "== lib/Makefile CPPFLAGS:"
          grep -E "^CPPFLAGS" "$W/curl/lib/Makefile" | head -3
          echo "== config.log SSL_set1_ech_config_list probe:"
          grep -B2 -A10 "set1_ech_config_list" "$W/curl/config.log" | head -40 || echo "not found"
          echo "== make V=1 single TU:"
          make -C "$W/curl/lib" V=1 vtls/libcurlu_la-openssl.lo 2>&1 | head -30
