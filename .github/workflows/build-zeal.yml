name: Build Zeal

# Follows zealdocs/zeal releases: upstream ships no macOS binaries, so a daily
# check builds the latest upstream release tag, deploys Qt into a
# self-contained Zeal.app, and publishes it as a tap release that
# Casks/zeal.rb picks up. Actions cannot observe another repo's release
# event, so the scheduled check polls the upstream API; manual dispatch can
# force-build any ref.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      zeal_ref:
        description: "Ref to build (tag like v0.9.1, or a branch); empty = latest release, already-built releases are skipped"
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  check:
    name: Check upstream release
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.check.outputs.ref }}
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - name: Check for new upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.zeal_ref }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_REF" ]; then
            # Manual dispatch always builds the requested ref.
            echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(gh api repos/zealdocs/zeal/releases/latest --jq .tag_name)
          version=${tag#v}
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/zeal-$version" >/dev/null 2>&1; then
            echo "zeal-$version already built; skipping"
            echo "ref=$tag" >> "$GITHUB_OUTPUT"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "new upstream release $tag; building"
            echo "ref=$tag" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: macOS 15 ${{ matrix.name }}
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: arm64,  runner: macos-15,       arch: arm64,  suffix: arm64 }
          - { name: x86_64, runner: macos-15-intel, arch: x86_64, suffix: x64 }

    steps:
      - name: Checkout Zeal source
        uses: actions/checkout@v4
        with:
          repository: zealdocs/zeal
          ref: ${{ needs.check.outputs.ref }}
          fetch-depth: 0

      - name: Install Dependencies
        run: brew install cpp-httplib libarchive tomlplusplus

      - name: Install Qt
        uses: trollixx/setup-qt@v1
        with:
          version: "6.11.1"
          modules: qtpositioning qttasktree qtwebchannel qtwebengine

      # Plain cmake (not lukka/run-cmake) for full control. One build per
      # arch: Homebrew libs (libarchive) are single-arch, so a fat build
      # cannot link the x86_64 slice. Qt is found via CMAKE_PREFIX_PATH set
      # by setup-qt. aqt's Qt binaries are fat (arm64+x86_64) on both
      # runners, so each leg links its own slice of the same Qt.
      - name: Configure
        run: cmake --preset release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}

      - name: Build
        run: cmake --build --preset release

      # Qt 6 macdeployqt auto-detects WebEngine dependencies (the old
      # -webengine flag no longer exists); -codesign=- ad-hoc signs the
      # embedded frameworks so the bundle launches on Apple Silicon.
      - name: Deploy Qt Runtime
        run: macdeployqt build/release/Zeal.app -codesign=- -verbose=1

      - name: Resolve Version
        id: meta
        run: |
          set -euo pipefail
          echo "version=$(<build/release/zeal_version)" >> "$GITHUB_OUTPUT"

      # The copied Qt frameworks are fat, so an untrimmed bundle ships both
      # Chromium slices (617MB): thin to this runner's arch, drop the DevTools
      # resources (only needed to debug web content) and re-sign, then smoke
      # test the exact bytes being shipped.
      - name: Package
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          rm -rf pkg && mkdir pkg
          cp -R build/release/Zeal.app pkg/Zeal.app
          rm pkg/Zeal.app/Contents/Frameworks/QtWebEngineCore.framework/Versions/A/Resources/qtwebengine_devtools_resources.pak
          find pkg/Zeal.app -type f -print0 |
            while IFS= read -r -d '' f; do
              if file "$f" | grep -q "Mach-O universal"; then
                lipo -thin ${{ matrix.arch }} "$f" -output "$f.thin" && mv "$f.thin" "$f"
              fi
            done
          codesign --force --deep --sign - pkg/Zeal.app
          codesign --verify --deep pkg/Zeal.app
          test -d pkg/Zeal.app/Contents/Frameworks/QtWebEngineCore.framework/Versions/A/Resources
          lipo -archs pkg/Zeal.app/Contents/MacOS/Zeal | grep -q "${{ matrix.arch }}"
          pkg/Zeal.app/Contents/MacOS/Zeal --version
          tar -cf - -C pkg Zeal.app | xz -9 -T0 > "Zeal-$VERSION-macos-${{ matrix.suffix }}.tar.xz"
          ls -lh Zeal-*.tar.xz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.suffix }}
          path: Zeal-*.tar.xz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # Rebuilding an already-released version replaces its assets instead
          # of failing on the existing tag; retire superseded .zip assets.
          for asset in $(gh release view "zeal-$VERSION" --json assets --jq '.assets[].name' 2>/dev/null | grep '\.zip$' || true); do
            gh release delete-asset "zeal-$VERSION" "$asset" --yes
          done
          gh release create "zeal-$VERSION" \
            --title "Zeal $VERSION" \
            --notes "Zeal built from zealdocs/zeal for macOS (arm64 & x86_64)." \
            "dist/Zeal-$VERSION-macos-arm64.tar.xz" \
            "dist/Zeal-$VERSION-macos-x64.tar.xz" ||
          gh release upload "zeal-$VERSION" --clobber \
            "dist/Zeal-$VERSION-macos-arm64.tar.xz" \
            "dist/Zeal-$VERSION-macos-x64.tar.xz"

      - name: Update Casks/zeal.rb
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"
          SHA_ARM=$(sha256sum "dist/Zeal-$VERSION-macos-arm64.tar.xz" | cut -d' ' -f1)
          SHA_X64=$(sha256sum "dist/Zeal-$VERSION-macos-x64.tar.xz" | cut -d' ' -f1)
          ruby .github/scripts/update-zeal-cask.rb "$VERSION" "$SHA_ARM" "$SHA_X64"

      - name: Commit cask
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/zeal.rb
          git diff --cached --quiet || git commit -m "zeal ${{ needs.build.outputs.version }}"
          git pull --rebase origin main
          git push origin main
