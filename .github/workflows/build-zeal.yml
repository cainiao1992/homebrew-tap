name: Build Zeal

# Follows zealdocs/zeal releases: upstream ships no macOS binaries, so a daily
# check builds the latest upstream release tag, deploys Qt into a
# self-contained Zeal.app, and publishes it as a tap release that
# Casks/zeal.rb picks up. Actions cannot observe another repo's release
# event, so the scheduled check polls the upstream API; manual dispatch can
# force-build any ref.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      zeal_ref:
        description: "Ref to build (tag like v0.9.1, or a branch); empty = latest release, already-built releases are skipped"
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  check:
    name: Check upstream release
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.check.outputs.ref }}
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - name: Check for new upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.zeal_ref }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_REF" ]; then
            # Manual dispatch always builds the requested ref.
            echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(gh api repos/zealdocs/zeal/releases/latest --jq .tag_name)
          version=${tag#v}
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/zeal-$version" >/dev/null 2>&1; then
            echo "zeal-$version already built; skipping"
            echo "ref=$tag" >> "$GITHUB_OUTPUT"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "new upstream release $tag; building"
            echo "ref=$tag" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: macOS 15 ARM64
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: macos-15
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout Zeal source
        uses: actions/checkout@v4
        with:
          repository: zealdocs/zeal
          ref: ${{ needs.check.outputs.ref }}
          fetch-depth: 0

      - name: Install Dependencies
        run: brew install cpp-httplib libarchive tomlplusplus

      - name: Install Qt
        uses: trollixx/setup-qt@v1
        with:
          version: "6.11.1"
          modules: qtpositioning qttasktree qtwebchannel qtwebengine

      - name: Configure & Build
        uses: lukka/run-cmake@v10
        with:
          configurePreset: release
          buildPreset: release

      # Qt 6 macdeployqt auto-detects WebEngine dependencies (the old
      # -webengine flag no longer exists); -codesign=- ad-hoc signs the
      # embedded frameworks so the bundle launches on Apple Silicon.
      - name: Deploy Qt Runtime
        run: macdeployqt build/release/Zeal.app -codesign=- -verbose=1

      - name: Smoke Test
        run: |
          set -euo pipefail
          APP=build/release/Zeal.app
          lipo -info "$APP/Contents/MacOS/Zeal" | grep arm64
          test -d "$APP/Contents/Frameworks/QtWebEngineCore.framework"
          test -d "$APP/Contents/Frameworks/QtWidgets.framework"
          "$APP/Contents/MacOS/Zeal" --version

      - name: Resolve Version
        id: meta
        run: |
          set -euo pipefail
          echo "version=$(<build/release/zeal_version)" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          set -euo pipefail
          ditto -c -k --keepParent build/release/Zeal.app \
            "Zeal-${{ steps.meta.outputs.version }}-macos-arm64.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-arm64
          path: Zeal-*-macos-arm64.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist-arm64
          path: dist

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # Rebuilding an already-released version replaces its asset instead
          # of failing on the existing tag.
          gh release create "zeal-$VERSION" \
            --title "Zeal $VERSION" \
            --notes "Zeal built from zealdocs/zeal for macOS (arm64)." \
            "dist/Zeal-$VERSION-macos-arm64.zip" ||
          gh release upload "zeal-$VERSION" --clobber \
            "dist/Zeal-$VERSION-macos-arm64.zip"

      - name: Update Casks/zeal.rb
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"
          SHA256=$(sha256sum "dist/Zeal-$VERSION-macos-arm64.zip" | cut -d' ' -f1)
          ruby .github/scripts/update-zeal-cask.rb "$VERSION" "$SHA256"

      - name: Commit cask
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/zeal.rb
          git commit -m "zeal ${{ needs.build.outputs.version }}"
          git pull --rebase origin main
          git push origin main
